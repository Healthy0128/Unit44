<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Guess Who / What?</title><style>
*{box-sizing:border-box}body{font-family:system-ui,"Yu Gothic",sans-serif;background:#edf4ff;color:#173451;margin:0}main{max-width:1050px;margin:auto;padding:20px}h1{font-size:clamp(30px,5vw,48px);margin:0 0 8px}h2{margin-top:0}.card{background:white;border:1px solid #d8e5f5;border-radius:22px;padding:24px;margin:14px 0;box-shadow:0 8px 24px #102e4a12}.hidden{display:none}.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}.split{display:grid;grid-template-columns:1fr 260px;gap:15px}button,input,select{font:inherit}button{padding:14px 20px;border-radius:13px;border:1px solid #adc7e5;background:#fff;color:#15518a;font-weight:800;cursor:pointer}button.primary{background:#2466d3;color:#fff}button.good{background:#078456;color:white}button:disabled{opacity:.4}input,select{padding:11px;border:1px solid #bdd0e5;border-radius:10px;min-width:0}.players{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:15px 0}.hint{border:1px solid #d3e3f5;background:#f5f9ff;border-radius:15px;padding:17px;margin:12px 0}.hint strong{color:#2065ba}.hint p{font-size:clamp(18px,2.4vw,25px);font-weight:700;line-height:1.5;margin:8px 0}.locked{border:2px dashed #d0dbe8;border-radius:15px;padding:15px;color:#8496a9;text-align:center;margin:12px 0}.score{display:flex;justify-content:space-between;border-bottom:1px solid #e6edf5;padding:10px 0}.answer{font-size:clamp(28px,4vw,44px);font-weight:900;color:#165cbd}.emoji{font-size:100px;text-align:center;margin:10px}.tag{display:inline-block;background:#e3f0ff;padding:6px 12px;border-radius:999px;font-weight:800}.muted{color:#667b91}.controls{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}@media(max-width:750px){.split,.players{grid-template-columns:1fr}.controls button{flex:1}}</style><main><header><h1>🕵️ Guess Who / What?</h1><div class="muted">Unit 5｜関係代名詞の目的格｜20問・交代制</div></header>
<section id="setup" class="card"><h2>プレイヤー設定</h2><div class="row"><label>人数 <select id="count"><option>2</option><option>3</option><option>4</option><option>5</option><option>6</option></select></label><label>順番 <select id="order"><option value="random">ランダム</option><option value="original">who → which → that → 混合</option></select></label></div><div class="players" id="names"></div><p class="muted">ヒント1で正解＝3点、ヒント2＝2点、ヒント3＝1点。答えを声に出してから正解ボタンを押そう。</p><button id="start" class="primary">ゲームスタート ▶</button></section>
<div id="playing" class="split hidden"><div><section id="handoff" class="card"><div class="tag" id="handoffProgress"></div><h2 id="nextName"></h2><p>パソコンを次の人に渡そう。</p><button class="primary" id="ready">準備OK ▶</button></section><section id="question" class="card hidden"><div class="row"><span class="tag" id="progress"></span><span class="tag" id="type"></span></div><h2 id="who"></h2><div id="hints"></div><div class="controls"><button class="good" id="correct">正解！ +3点</button><button class="primary" id="nextHint">次のヒント</button><button id="giveup">わからない・0点</button></div><p class="muted">※答えとイラストは答え合わせまで表示されません。</p></section><section id="answer" class="card hidden"><div class="tag">答え合わせ</div><div class="emoji" id="picture"></div><div class="answer" id="english"></div><h2 id="japanese"></h2><h2 id="gain"></h2><div class="hint" id="example"></div><button class="primary" id="continue">次の人へ ▶</button></section><section id="finish" class="card hidden"><h2>🏆 最終結果</h2><div id="final"></div><button class="primary" id="again">もう一度遊ぶ</button><button id="reset">設定に戻る</button></section></div><aside><section class="card"><h2>📊 スコア</h2><div id="scores"></div></section><section class="card"><h3>これまでの結果</h3><div id="log"></div></section></aside></div></main><script>
const data=[["Florence Nightingale","ナイチンゲール","who","👩‍⚕️",["She is a woman who many people still respect.","She is a nurse who wounded soldiers needed during a war.","She is a woman who people called the Lady with the Lamp."]],["Shibusawa Eiichi","渋沢栄一","who","💴",["He is a Japanese leader who many businesspeople respect.","He is a man who people remember for helping establish many companies.","He is the man who you can see on the new 10,000-yen bill."]],["Ino Tadataka","伊能忠敬","who","🗾",["He is a Japanese man who many students learn about in history.","He is a person who people remember for traveling around Japan.","He is the man who people know for making an accurate map of Japan."]],["Ludwig van Beethoven","ベートーヴェン","who","🎼",["He is a musician who many people admire.","He is a composer who people remember for writing music despite serious hearing problems.","He is the composer who people know for his Ninth Symphony and Ode to Joy."]],["Sota Fujii","藤井聡太","who","♟️",["He is a Japanese person who many young people admire.","He is a player who many professional players have competed against.","He is a shogi player who people know for winning all eight major titles in 2023."]],["Platypus","カモノハシ","which","🦆",["It is an animal which many people have never seen in the wild.","It is an animal which scientists once found very unusual.","It is an Australian animal which people recognize by its duck-like bill."]],["Koala","コアラ","which","🐨",["It is an animal which many tourists want to see in Australia.","It is an animal which people often see sleeping in trees.","It is an animal which people associate with eucalyptus leaves."]],["Penguin","ペンギン","which","🐧",["It is a bird which many children love.","It is a bird which people often watch swimming at aquariums.","It is a bird which people recognize by its black-and-white body and its inability to fly."]],["Octopus","タコ","which","🐙",["It is an animal which scientists study because it is intelligent.","It is a sea animal which people eat in dishes such as takoyaki.","It is an animal which people recognize by its eight arms."]],["Chameleon","カメレオン","which","🦎",["It is an animal which you can find in warm parts of the world.","It is a reptile which people know for its unusual eyes.","It is an animal which many people associate with changing skin color."]],["Takoyaki","たこ焼き","that","🐙",["It is a food that many people enjoy at festivals.","It is a Japanese food that you can buy at many shops in Osaka.","It is a round food that people make with pieces of octopus inside."]],["Curry and rice","カレーライス","that","🍛",["It is a dish that many Japanese families cook at home.","It is a dish that students often eat for school lunch.","It is a meal that people make with rice, vegetables, meat, and curry sauce."]],["Macaron","マカロン","that","🍬",["It is a sweet that many people buy as a gift.","It is a colorful dessert that people often find in French pastry shops.","It is a small sweet that bakers make with two round almond-based shells and a filling."]],["Drone","ドローン","that","🚁",["It is a machine that some people use for work.","It is a machine that photographers use to take pictures from the sky.","It is a small flying machine that people can control from the ground."]],["Microwave oven","電子レンジ","that","🍲",["It is a machine that many families have at home.","It is something that people use in the kitchen.","It is a machine that you can use to heat food quickly."]],["Hayao Miyazaki","宮崎駿","who","🎬",["He is a Japanese artist who many people around the world admire.","He is a director who people know for beautiful animated movies.","He is the director who many people associate with My Neighbor Totoro and Spirited Away."]],["Wireless earphones","ワイヤレスイヤホン","which","🎧",["They are things which many young people use every day.","They are things which people use to listen to music without a cable.","They are small devices which people put in their ears and often keep in a charging case."]],["3D printer","3Dプリンター","that","🖨️",["It is a machine that many designers use.","It is a machine that people use to make models and objects.","It is a machine that people use to create three-dimensional objects, often layer by layer."]],["Tokyo Skytree","東京スカイツリー","which","🗼",["It is a place which many tourists visit in Japan.","It is a tower which you can see from many places in Tokyo.","It is a tower which people know for its height of 634 meters."]],["The Egyptian pyramids","エジプトのピラミッド","that","🔺",["They are buildings that people built a very long time ago.","They are structures that many tourists visit in Egypt.","They are huge stone structures that ancient Egyptians built, some as tombs for pharaohs."]]];
const el=id=>document.getElementById(id);let players=[],queue=[],idx=0,level=1,history=[];
const screens=["handoff","question","answer","finish"];
function show(s){screens.forEach(x=>el(x).classList.toggle("hidden",x!==s))}
function names(){el("names").innerHTML=Array.from({length:+el("count").value},(_,i)=>'<label>プレイヤー '+(i+1)+'<br><input id="p'+i+'" value="Player '+(i+1)+'"></label>').join("")}
el("count").onchange=names;names();
function current(){return queue[idx]}function person(){return players[idx%players.length]}
function score(){el("scores").innerHTML=players.slice().sort((a,b)=>b.score-a.score).map(p=>'<div class="score"><span>'+safe(p.name)+'</span><strong>'+p.score+'点</strong></div>').join("");el("log").innerHTML=history.slice().reverse().map(h=>'<p>Q'+h.n+' '+safe(h.name)+' +'+h.pts+'点</p>').join("")}
function safe(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function start(){players=Array.from({length:+el("count").value},(_,i)=>({name:el("p"+i).value.trim()||"Player "+(i+1),score:0}));queue=data.map((q,i)=>({q,i}));if(el("order").value==="random"){for(let i=queue.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[queue[i],queue[j]]=[queue[j],queue[i]]}}idx=0;history=[];el("setup").classList.add("hidden");el("playing").classList.remove("hidden");handoff()}
function handoff(){if(idx>=queue.length){finish();return}level=1;el("handoffProgress").textContent="Q"+(idx+1)+" / "+queue.length;el("nextName").textContent=person().name+" の番！";score();show("handoff")}
function question(){let q=current().q;el("progress").textContent="Q"+(idx+1)+" / "+queue.length;el("type").textContent=q[2];el("who").textContent=q[2]==="who"?"Who am I?":"What am I?";el("hints").innerHTML=q[4].map((h,i)=>i<level?'<div class="hint"><strong>Hint '+(i+1)+'</strong><p>'+safe(h)+'</p></div>':'<div class="locked">🔒 Hint '+(i+1)+'</div>').join("");el("correct").textContent="✅ 正解！ +"+(4-level)+"点";el("nextHint").disabled=level===3;el("nextHint").textContent=level===3?"ヒントはすべて表示済み":"次のヒントを見る →";show("question")}
function answer(ok){let q=current().q,pts=ok?4-level:0;person().score+=pts;history.push({n:idx+1,name:person().name,pts});el("picture").textContent=q[3];el("english").textContent=q[0];el("japanese").textContent=q[1];el("gain").textContent="+"+pts+"点";el("example").textContent=q[4][level-1];el("continue").textContent=idx===queue.length-1?"結果を見る →":"次の人へ →";score();show("answer")}
function finish(){el("final").innerHTML=players.slice().sort((a,b)=>b.score-a.score).map((p,i)=>'<div class="score"><strong>'+(i+1)+'位 '+safe(p.name)+'</strong><strong>'+p.score+'点</strong></div>').join("");show("finish")}
el("start").onclick=start;el("ready").onclick=question;el("nextHint").onclick=()=>{if(level<3){level++;question()}};el("correct").onclick=()=>answer(true);el("giveup").onclick=()=>{if(confirm("この問題を0点にして答えを表示しますか？"))answer(false)};el("continue").onclick=()=>{idx++;handoff()};el("again").onclick=start;el("reset").onclick=()=>{el("playing").classList.add("hidden");el("setup").classList.remove("hidden")};
</script></html>
